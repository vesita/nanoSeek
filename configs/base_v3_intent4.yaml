# ============================================================================
# v3 分段训练 · intent 线第四轮（v3_intent4）：**单变量实验** —— 只做语料级身份清除
# ============================================================================
# 用法：
#     .venv/bin/python training/train.py configs/base_v3_intent4.yaml
#
# 依据：dev-notes/86 §7 教训「每轮只动一个变量」。与 intent2 相比**唯一**的差别：
#   replay_dlg 里命中身份黑名单的 15 块（NexTalk 自我介绍等）被整块移除
#   （86 §6：黑名单只挡挖掘侧挡不住 replay，必须语料级清除）。
#   数据池（598 挖掘 + 177 合成）、lr 5e-5、3000 步、评估节律**逐项与 intent2 相同**
#   —— 生成侧若不再自称 NexTalk，即可归因给这一次清除。
#   复现：见 stages/v3_intent4（由 stages/v3_intent2 复制 + replay_dlg 黑名单滤块）。
#
# 判据（启动前写死，事后不改；起点 = v3_intent2 终态）：
#   1. ★ 主判据（本实验的自变量）：`你是谁研发的？` 两组 4 条生成里，
#      自称 NexTalk 的条数 = 0（intent2 现值 1/2）；且 makers 组 ≥1 条语义正确
#   2. intent_probe 总分不回落：≥ 18/28（现值 20）
#   3. 通用尺子：v3_lang ≤ 4.60（现值 4.5521）；烟感器 wiki/c4 ≤ +0.08
#   4. 行为守卫：自开率 ≥ 5%、收尾率 ≥ 85%、avg_len ∈ [20, 60]（防 intent3 式变短）
#   5. 自身 val 上升 ≤ +0.10
extends: base_v2.yaml

# --- 1) 产物隔离（★ 铁律 12） ----------------------------------------------
out_dir: out/base_v3_intent4

# --- 2) 权重来源：intent 线最优（86 §6/§7） ---------------------------------
init_from: out/base_v3_intent2/last.pt

# --- 3) 语料 + 打包（★ §5.10） ----------------------------------------------
data_prefix: v3_intent4

use_doc_packing: true
pack_align: false
use_loss_masking: false

# --- 4) 学习率：与 intent2 逐项相同（单变量纪律） ---------------------------
schedule: wsd
stage: full
learning_rate: 0.00005
min_lr: 0.000005
warmup_iters: 100
stable_frac: 0.8

# --- 5) 步数：与 intent2 相同 ------------------------------------------------
max_iters: 3000
lr_decay_iters: 3000

# --- 6) 评估节律：与 intent2 相同 -------------------------------------------
eval_interval: 500

# ============================================================================
# v3 分段训练 · 意图跟随第三轮（v3_intent3，2.5k 步，自然度修正轮）
# ============================================================================
# 用法：
#     .venv/bin/python training/train.py configs/base_v3_intent3.yaml
#
# 依据：analysis/dialogue_naturalness_intent2.md 四条修法的前三条——
#   ① 合成回复池扩到 12~20 条/意图（合成 268→1128 块，压模板回声）
#   ② 挖掘侧 comfort/stress/weather 加"完整句"过滤（剔同伴闲聊碎片，598→530）
#   ③ 意图:replay ≈1:6.1 不变，靠多样性而非步数压回声
# 配方：起点 = out/base_v3_intent2/last.pt；lr 再降一档 3e-5（前两段已把域内压得很低）。
#
# 判据（启动前写死，事后不改；起点 = v3_intent2 终态）：
#   1. intent_probe 不回落：关键词 ≥ 18/28（现值 20），语义对 ≥ 11
#   2. 通用尺子：v3_lang 全库 real ≤ 4.60（现值 4.5521，容 +0.05）；烟感器 wiki/c4 各 ≤ +0.08
#   3. ★ 新增自然度守卫：rep2 ≤ 0.08、d1 ≥ 0.88（现值 0.103 / 0.859 —— 回声必须降）
#   4. 自身 val 上升 ≤ +0.10（背化守卫；前两段 +0.15 / +0.39 连续恶化）
#   5. eval_multiturn 自开率 ≥ 5%，收尾率 ≥ 85%（现值 8% / 83%）
extends: base_v2.yaml

# --- 1) 产物隔离（★ 铁律 12） ----------------------------------------------
out_dir: out/base_v3_intent3

# --- 2) 权重来源：上一段链路末端 --------------------------------------------
init_from: out/base_v3_intent2/last.pt

# --- 3) 语料 + 打包（★ §5.10） ----------------------------------------------
data_prefix: v3_intent3

use_doc_packing: true
pack_align: false
use_loss_masking: false

# --- 4) 学习率：3e-5 WSD（第三段，域内已低位，防继续加深记忆）----------------
schedule: wsd
stage: full
learning_rate: 0.00003
min_lr: 0.000003
warmup_iters: 100
stable_frac: 0.8

# --- 5) 步数：bin ≈ 1.27M token，2500 步 ≈ 20 epoch（intent 部分约 11 遍）----
max_iters: 2500
lr_decay_iters: 2500

# --- 6) 评估节律 -------------------------------------------------------------
eval_interval: 500

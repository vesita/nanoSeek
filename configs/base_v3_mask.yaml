# ============================================================================
# v3 分段训练 · 实验段：**答案段掩码**短跑（v3_dlg，3k 步）
# ============================================================================
# 继承 base_v2.yaml，并覆盖本段配方。用法：
#     .venv/bin/python training/train.py configs/base_v3_mask.yaml
#
# ★★ 本段是一个**探针式实验**，不是要一次训到位。唯一自变量：
#       use_loss_masking: false → true
#   `mask_mode` 保持默认 `eos_line`（**不需要写新代码**）：
#   `eos_line` 的规则是"token 所在**行**内含 `<eos>/<cont>` ⇒ 该行算 loss"
#   （实现 `training/masking.py::build_assistant_mask`，向量化、有测试）。
#   在 `A：…\nB：…<eos>` 格式里，**问题行不含终止符 ⇒ 天然被排除**，
#   只有 `B：…<eos>` 行算 loss ⇒ **这就是"答案段掩码"**。
#
#   背景：B 段（`base_v3_dlg.yaml`）在同一批语料上训了 14000 步，但那个开关是
#   **false** ⇒ 它在学"整个对话的联合分布"（含生成问题），而不是"给定问题→产出回答"。
#   本段补的就是这个从没试过的变量。
#
#   它同时回答一个**悬着的问题**：`analysis/corpus_quality_v2.md` 表 7 用 8-gram
#   证明语料"**没有逐字承接**"（打乱轮序 Δ 中位数 = 0.0000），但该文 §9 自己写明
#   **"不能证明没有语义依赖"**。若多轮语料在语义上确有承接，答案段掩码应能让
#   **意图跟随**变好；若无，本段会**干净地失败** —— 那也是省时间的结论
#   （⇒ 转"扩陪聊语料"那条路，不再在旧数据上磨）。
#
# 判据（启动前写死，见对话记录/审查报告；**事后不许改**）：
#   1. 主判据 `scripts/intent_probe.py --out-dir out/base_v3_mask`：通过率 > 现状 0/28，
#      目标 ≥ 5/28（优于 B 段的 3/19）
#   2. §5.10 硬要求：`mask_density_probe` 有效 token 占比 ≥ 40%
#   3. §5.12 两把尺子：**通用尺子已从 v2 bin 换成 `v3_lang` val**（2026-09-15 用户拍板
#      退役 v2 评估 —— 它来自旧管线，量到的是"管线距离+能力距离"的混合，见 §5.11）；
#      配对前后 `per_source_ce_probe`：`v3_lang` **全库 real 不得劣于起点 4.7541 + 0.10**；
#      **烟感器单源用现代中文**（`wikipedia_cn` 起点 3.4866、`c4_zh` 3.6865 —— 模型在这两个源上
#      本来就擅长、val_blocks 又多；四大名著是文言弱源、只作次要读数）；
#      v3_dlg 自己的 val 应**变好**
#   4. 轮次结构：`eval_multiturn --style ab` 的**自开轮次率**不低于 B 段基线、
#      **收不住率**不得从 0% 恶化
#   5. 异常关键字 0、结束日志有 `最终 best_val_loss`
#
# 依据：用户 2026-09-15「按照你推荐的方式来」+「v2 评估可以扔了」。
#
extends: base_v2.yaml

# --- 1) 产物隔离 ------------------------------------------------------------
# warm start 会触发 `_backup_old_run(out_dir)`，所以本段必须有独立 out_dir。
out_dir: out/base_v3_mask

# --- 2) 权重来源：当前权重（站 1 人格 + 站 2 通识之后）----------------------
init_from: out/base_v3_know2/last.pt

# --- 3) 语料 + 打包 + ★ 本段的自变量 ----------------------------------------
# data_prefix 与 B 段**相同** ⇒ 保证唯一变量是那个掩码开关。
data_prefix: v3_dlg

use_doc_packing: true
pack_align: false          # ★★ §5.10 硬要求：块对齐会让 67~73% 的 token 永远采不到
use_loss_masking: true     # ★ 本段自变量：答案段掩码（eos_line ⇒ 只算 B：…<eos> 行）
mask_mode: eos_line        # 显式写出来，免得将来默认值变了而静默改变本段语义

# --- 4) 学习率配方（探针式短跑，开一段新的 WSD 循环）------------------------
# lr 取 B 段（2e-4）的**一半**：站 2 刚把站 1 打坏的通用能力修回来，本段不该再打坏它。
schedule: wsd
stage: full
learning_rate: 0.0001
min_lr: 0.00001
warmup_iters: 100
stable_frac: 0.8

# --- 5) 步数：短跑（约 2.9 h）------------------------------------------------
# 这是"有没有信号"的探针，不是最终训练。3000 步 ≈ 0.21 epoch（v3_dlg 114.2M token）。
# ★ 若 3000 步后意图跟随仍是 0 ⇒ 结论是"现有多轮语料的语义承接不足以教会意图跟随"，
#   直接转"扩陪聊语料"，**不要**在这里加步数硬磨。
max_iters: 3000
lr_decay_iters: 3000

# --- 6) 评估节律：短跑要密一点（继承 base_v2 的 1000 太稀）------------------
eval_interval: 500

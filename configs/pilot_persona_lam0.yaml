# ============================================================================
# λ 短臂（头对头）：`ndb_att_sim = 0`，即**关掉**检索相关性注入
# ============================================================================
# 目的：回答「`ndb_att_sim`（λ）到底有没有用」。它只在**免训练探针**上验过
#   （step 19000，25% 检索错误时 λ=2 是 +0.24、λ=0 是 −0.36），**从没在训练里跑过**。
#
# 设计（与 `pilot_persona_lam2.yaml` 严格配对，**只差 λ 一个键**）：
#   · 同基座 `out/base_v3_dlg/last.pt`、同语料、同步数、同 seed（default）、同库
#   · 400 步 = 4.0 epoch（809,598 token ÷ 8192 = 98.8 步/epoch）
#   · 判据看 `ndb.csv` 的**配对** Δ（四条件同一批 val batch），**不看**单点 val
#
# ★ 命名故意**不带 `base_v3_` 前缀**：它们是一次性 pilot，不是阶段，不入 `V3_STAGE_STEPS`。
extends: base_v3_persona.yaml

out_dir: out/pilot_persona_lam0
# init_from / data_prefix / mask_mode / ndb_store / ndb_layer ... 全部继承 base_v3_persona

max_iters: 400
lr_decay_iters: 400
warmup_iters: 40
eval_interval: 100

ndb_att_sim: 0.0         # ★ 本臂：关（旧行为）

# ============================================================================
# λ 短臂（头对头）：`ndb_att_sim = 2`，即**开启**检索相关性注入
# ============================================================================
# 与 `pilot_persona_lam0.yaml` **只差 `ndb_att_sim` 一个键**（其余全部继承 base_v3_persona）
#   ⇒ 两臂的 Δ 差异可以直接归因给 λ，不需要别的解释。
#
# λ=2 的依据（免训练探针，step 19000，`local/eval_ndb_probe.py` P6 的 λ 扫描）：
#   | λ | 干净 Δ | 1 槽污染 Δ | 全随机 Δ |
#   | 0 | −0.0612 | **+0.0455（有害）** | +0.1329 |
#   | 2 | −0.0542 | **−0.0075（转正）** | +0.1127 |
#   ⇒ 用 11% 的干净增益换「检索出错时记忆仍然有益」（25% 错误：+0.24 vs λ=0 的 −0.36）。
# 本臂要回答的就是：**这个交换在训练里兑不兑现。**
#
# ★ 顺带必须盯的一个数：**Δ_rand**（`ndb.csv` 第 5 列）。
#   pilot 臂若把 Δ_rand 从强正压下来 ⇒ 说明 sim 注入真的在教"别乱信检索"。
extends: base_v3_persona.yaml

out_dir: out/pilot_persona_lam2

max_iters: 400
lr_decay_iters: 400
warmup_iters: 40
eval_interval: 100

ndb_att_sim: 2.0         # ★ 本臂：开

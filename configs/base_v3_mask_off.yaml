# ============================================================================
# v3 分段训练 · 实验段 **对照臂**：答案段掩码（v3_dlg，3k 步，masking OFF）
# ============================================================================
# 用法：
#     .venv/bin/python training/train.py configs/base_v3_mask_off.yaml
#
# ★★ 这是 `configs/base_v3_mask.yaml` 的**配对对照臂**。两者唯一的差别是
#    `use_loss_masking`（本段 false，那段 true）；起点权重、语料、lr 配方、
#    步数、评估节律**逐项相同**。
#
#   为什么要这个臂：`base_v3_mask` 是**单臂**。它跑完只会有两种结果，
#    而**两种都无法单独归因**：
#      · 意图跟随仍为 0 ⇒ 可能是"掩码没用"，也可能是"3k 步（0.21 epoch、
#        约 13M 有效 token，仅 B 段 114M 的 11%）本来就太少" —— 分不开；
#      · 意图跟随 > 0 ⇒ 归因给掩码也缺对照（B 段 3/19 是另一个预算下的数，
#        不能当对照，见 §5.6）。
#    加了对照臂，两种结果都能读：**等算力（同为 3000 步）下哪个更好**。
#
# 判据（与掩码臂**同一套**，启动前写死）：
#   1. 主判据 `scripts/intent_probe.py --out-dir out/base_v3_mask_off` 通过率，
#      与掩码臂同判据直接比（生成侧指标，与 loss 口径无关）
#   2. `scripts/per_source_ce_probe.py`：**口径与 `use_loss_masking` 无关**
#      （§9 明确写了），所以两臂可用它做**同尺子**比较 —— 这是本对照能成立的关键
#   3. ★ **不要**拿两臂的 `results.csv` val 互比：`get_batch` 里
#      `y[~build_assistant_mask(y)] = -100` 对训练**和验证**都生效
#      （train.py:555），所以两臂的 val 分母不同 = **换了一把尺子**（§5.6 同族）。
#      两臂对比一律走 `per_source_ce_probe` / `intent_probe`。
#
# 依据：用户 2026-09-15「按照你推荐的方式来」+ 2026-09-16 夜里授权自由裁定
#       （「如果明天早上前训练结束了，你可以基于你的推荐进行修改」）。
extends: base_v2.yaml

# --- 1) 产物隔离（★ 铁律 12：warm start 会触发 _backup_old_run）-------------
out_dir: out/base_v3_mask_off

# --- 2) 权重来源：与掩码臂**完全相同**的起点 --------------------------------
init_from: out/base_v3_know2/last.pt

# --- 3) 语料 + 打包 + ★ 本段自变量（= 掩码臂的另一端）-----------------------
data_prefix: v3_dlg        # 与掩码臂相同 ⇒ 唯一变量是掩码开关

use_doc_packing: true
pack_align: false          # ★★ §5.10 硬要求：块对齐会让 67~73% 的 token 永远采不到
use_loss_masking: false    # ★ 本段自变量：**不掩码** ⇒ 全 token 参与 loss（含问题行）

# --- 4) 学习率配方：与掩码臂逐项相同 ----------------------------------------
schedule: wsd
stage: full
learning_rate: 0.0001
min_lr: 0.00001
warmup_iters: 100
stable_frac: 0.8

# --- 5) 步数：与掩码臂相同（**等算力**，不是等有效 token）--------------------
# ★ 选等算力而非等有效 token 的理由：算力才是真实预算，"同算力下哪个更好"
#   才是要做的决定；等有效 token 是机制解释问题，等决定做完再问。
max_iters: 3000
lr_decay_iters: 3000

# --- 6) 评估节律：与掩码臂相同 ---------------------------------------------
eval_interval: 500

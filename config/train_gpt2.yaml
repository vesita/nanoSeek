# config for training GPT-2 (124M) down to very nice loss of ~2.85 on 1 node of 8X A100 40GB
# launch as the following (e.g. in a screen session) and wait ~5 days:
#   torchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.yaml

wandb_log: true
wandb_project: owt
wandb_run_name: gpt2-124M

# 总 batch size ~0.5M：12 * 1024 * 5 gradaccum * 8 GPUs = 491,520
batch_size: 12
block_size: 1024
gradient_accumulation_steps: 40

# 总 token 数 ~300B
max_iters: 600000
lr_decay_iters: 600000

# eval
eval_interval: 1000
eval_iters: 200
log_interval: 10

# weight decay
weight_decay: 0.1

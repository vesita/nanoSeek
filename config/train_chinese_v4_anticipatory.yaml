# V4 技术验证 #4：Anticipatory Routing（预判路由）
# 离散路由选择用 EMA 旧参数副本（与骨干解耦），防异常值被路由逐层放大。
# 对比基线：train_chinese_moe.yaml（同配置、当前参数路由）。
# ar_momentum 越大，路由用的参数越"旧"；0.99 是合理起步，可尝试 0.95 / 0.995。
out_dir: out/chinese-v4-anticipatory
eval_interval: 250
eval_iters: 200
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: v4-tech
wandb_run_name: anticipatory-routing
dataset: chinese
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

# --- modern 三件套 ---
use_rmsnorm: true
use_rope: true
use_swiglu: true

# --- MoE 开关 ---
use_moe: true
n_experts: 8
n_top_k: 2
moe_aux_weight: 0.01

# --- V4 技术 #4：预判路由 ---
use_anticipatory_routing: true   # false = 当前参数路由（基线）
ar_momentum: 0.99                # 慢路由 EMA 系数

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

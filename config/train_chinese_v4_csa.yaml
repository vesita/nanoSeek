# V4 技术验证 #5：CSA/HCA 压缩稀疏注意力
# 块级 KV 压缩 + top-k 稀疏块选择 + 滑窗局部注意力 + HCA 重度压缩全局信号。
# 对比基线：train_chinese_moe.yaml（同配置、标准全量因果注意力）。
# 注意：CSA 需要 use_rope 提供位置信息；csa_compress 越小越接近全量注意力，
#       topk 越大全局信息越全但越贵——这两个超参正是"压缩 vs 精度"的权衡点。
out_dir: out/chinese-v4-csa
eval_interval: 250
eval_iters: 200
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: v4-tech
wandb_run_name: csa-hca
dataset: chinese
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

# --- modern 三件套（CSA 必须开 use_rope）---
use_rmsnorm: true
use_rope: true
use_swiglu: true

# --- MoE 开关 ---
use_moe: true
n_experts: 8
n_top_k: 2
moe_aux_weight: 0.01

# --- V4 技术 #5：CSA/HCA 混合注意力 ---
use_csa: true       # false = 标准全量注意力（基线）
csa_compress: 16    # 每 16 个 token 压成一个潜在 KV
csa_topk: 4         # 每个 query 稀疏选 4 个压缩块
csa_window: 64      # 滑窗保留最近 64 个原始 token
use_hca: true       # 加 HCA 重度压缩全局信号

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

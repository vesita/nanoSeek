# V4 技术验证 #2：Muon 优化器
# 用 Muon（Newton-Schulz 正交化 + 动量）替代 AdamW，验证收敛是否更稳/更快。
# 对比基线：train_chinese_moe.yaml（同配置、AdamW）。
# 注意：Muon 对 lr 的敏感度和 AdamW 不同，这里先用相同 lr 做公平对比，
# lr 该不该单独调，本身就是值得观察的实验点。
out_dir: out/chinese-v4-muon
eval_interval: 250
eval_iters: 200
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: v4-tech
wandb_run_name: muon
dataset: chinese
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

# --- modern 三件套 ---
use_rmsnorm: true
use_rope: true
use_swiglu: true

# --- MoE 开关 ---
use_moe: true
n_experts: 8
n_top_k: 2
moe_aux_weight: 0.01

# --- V4 技术 #2：Muon 优化器 ---
use_muon: true   # false = AdamW（基线）

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

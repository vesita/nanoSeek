# modern 架构配置：small 模型 + DeepSeek 三件套
# 与 train_shakespeare_char.yaml 超参一致，仅打开三个 modern 开关：
#   use_rmsnorm: true   LayerNorm -> RMSNorm
#   use_rope: true      wpe(可学习位置编码) -> RoPE(旋转位置编码)
#   use_swiglu: true    GELU MLP -> SwiGLU
# 这样跑出来的 loss 可直接与基线做 A/B 对比。
out_dir: out/shakespeare-char-modern
eval_interval: 250
eval_iters: 200
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: shakespeare-char
wandb_run_name: modern-gpt
dataset: shakespeare_char
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

# --- modern 开关：全部打开 ---
use_rmsnorm: true
use_rope: true
use_swiglu: true
rope_theta: 10000.0

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

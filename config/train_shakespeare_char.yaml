# 基线配置：small 模型（~0.83M 参数），训练约 1 分钟
out_dir: out/shakespeare-char
eval_interval: 250        # 因为会过拟合，评估频繁一点
eval_iters: 200
log_interval: 10          # 别打印太频繁
always_save_checkpoint: false   # 只存 val 最优的 checkpoint
wandb_log: false
wandb_project: shakespeare-char
wandb_run_name: mini-gpt
dataset: shakespeare_char
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256           # 上下文最多 256 个字符

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

# MoE 配置：中文 small + MoE 混合专家（DeepSeek-V3 核心）
# 与 train_chinese.yaml 超参一致，仅把 FFN 换成 MoE（8 专家、每 token 激活 top-2）。
# 总参数约 3.5M，但每个 token 的计算量仍只相当于 1 个 FFN——这就是 MoE 的精髓。
# 提示：moe_aux_weight 是负载均衡辅助损失权重，太小会让专家"饿死"，太大则干扰主任务。
out_dir: out/chinese-moe
eval_interval: 250
eval_iters: 200
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: chinese-moe
wandb_run_name: moe-gpt
dataset: chinese
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（默认配置）
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2

# --- MoE 开关：FFN → 混合专家 ---
use_moe: true
n_experts: 8          # 专家总数
n_top_k: 2            # 每个 token 激活的专家数
moe_aux_weight: 0.01  # 负载均衡辅助损失权重

# 想同时开 modern 三件套：加下面三行
# use_rmsnorm: true
# use_rope: true
# use_swiglu: true

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

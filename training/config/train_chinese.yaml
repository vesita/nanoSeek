# 唯一默认配置：中文对话模型，CSA/HCA 压缩稀疏注意力 + MoE。
# 固定架构（硬编码）：RMSNorm + SwiGLU；RoPE 由 use_rope 开关控制。
# 四项 V4 升级：CSA 可学习门控池化 / MoE 共享专家 + aux-free + √softplus / Muon / MTP
# csa_compress 越小越接近全量注意力，topk 越大全局信息越全但越贵。
# 规模：6×80 深度换宽度（+MTP ~2.85M 参数），适配 8000 BPE 词表。
# 快速验证代码是否跑得通用 test.yaml（步数少、模型更小）。
# out_dir 指向默认模型（ab2-qkv：SDPA 滑窗 + 融合 QKV，val 1.8666 @1500；A/B 三连胜者）。
# 2026-08-19 迁移：chinese-data2-eos → ab2-qkv（use_csa_fused_qkv 默认已翻 True，与 ab2 权重布局一致）。
# 旧模型（lm/eos/ab1）加载需显式 --use_csa_fused_qkv=false。
# 重训会用 out_dir/old 保护机制归档旧实验。
out_dir: out/chinese-data2-ab2-qkv
eval_interval: 250
eval_iters: 100
log_interval: 10
always_save_checkpoint: false
wandb_log: false
wandb_project: chinese
wandb_run_name: csa-v4
dataset: chinese
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256

# small 模型（~2.85M 参数含 MTP；6×80 深度换宽度，规模与旧 4×96 持平）
vocab_size: 8000   # 显式指定，防止 GPTConfig 默认 50304（GPT-2 词表）
n_layer: 6         # 4→6：加深，重复坍缩部分原因是太浅学不到长期依赖
n_head: 4
n_embd: 80         # 96→80：深度换宽度，规模持平（head_dim=20，qk_rope_head_dim=16 仍适配）
dropout: 0.2

# --- 位置编码：RoPE ---
use_rope: true
rope_theta: 1000000.0   # 10000→1e6：更低的旋转频率，能表达更远的相对距离（DeepSeek 做法）

# --- MoE 混合专家 ---
use_moe: true
n_experts: 4
n_top_k: 2
moe_aux_weight: 0.01
use_shared_expert: true   # A/B 验证有效（val loss 5.01→4.91）：共享专家捕获共性特征

# --- CSA/HCA 混合注意力（默认；也可换 MLA）---
use_csa: true
csa_compress: 16    # 每 16 个 token 压成一个潜在 KV
csa_topk: 4         # 每个 query 稀疏选 4 个压缩块
csa_window: 64      # 滑窗保留最近 64 个原始 token
use_hca: true       # 加 HCA 重度压缩全局信号
use_csa_learnable: true   # 可学习门控池化替代平均池化

# --- MTP 多 token 预测（V3/V4 验证过，训练信号增强，推理零开销）---
use_mtp: true
n_mtp: 1
mtp_weight: 0.3

# --- V4 结构设计升级（已验证进默认）---
use_attn_sink: true       # Attention Sinks：打破重复坍缩的必要条件（三重 A/B 验证）
use_mhc: true                 # mHC：4 流并行残差——1500 步归因收敛加速（dev-notes/13）
hc_mult: 4
use_qk_norm: true             # QK-Norm：L2 归一化 q/k + 每头可学习 scale（+24 参数），val −0.052（dev-notes/25）
z_loss_weight: 0.0001         # Router Z-Loss：z=logsumexp(router)² 正则（0 参数），与 QK 合开 −0.189 超线性（dev-notes/25）
# use_lightning_indexer: true  # 学习型块选择替代 CSA raw top-k
# num_hash_layers: 2           # 前 2 层用 hash 路由
# 计算图重排（拓扑实验 A）：块内子层顺序。attn_ffn（默认）| ffn_attn。
# 零参数、零权重名变更，只换执行顺序。ffn_attn 的对照配置见 train_chinese_fa.yaml。
block_order: attn_ffn
no_attn_layers: []       # 稀疏注意力布线（拓扑实验 B）：空=所有层都有注意力
n_memory_tokens: 0       # 显式记忆 token（拓扑实验 C）：0=关闭；对照配置见 train_chinese_mem.yaml

learning_rate: 0.001
max_iters: 5000
lr_decay_iters: 5000
min_lr: 0.0001
beta2: 0.99
warmup_iters: 100

# =============================================================================
# 数学题基础规则配置 (RL 奖励引擎 / 提示词池共用)
#
# 设计思想 (dev-notes 待续):
#   "配置文件生成基础规则 + 代码添加格式化噪音" —— 配置文件只描述**语义层**:
#     数字范围、每种运算的多种表面写法、问句模板;
#   代码在加载时展开成**带格式化噪音的具体提示词** (如 3+4 / 3加4 / 3加上4 / ３＋４),
#   奖励引擎用同一份配置构建识别正则 → "提示词用到的写法, 奖励一定认" 的闭环。
#
# 修改规则 = 只改这个文件, 不碰代码。
# =============================================================================

[arith]
# 数字范围: 两个操作数 a、b 都在 [min_num, max_num] (含端点);
# **结果也须 ≤ max_num** (非负整数; "100 以内" = 操作数和结果都不超界)。
min_num = 0
max_num = 100
# 结果须为非负整数; 除法要求整除且除数非零 (见下 op.fn)。
require_nonneg_result = true
# 排除"平凡题": 任何运算里操作数为 0, 或 乘/除 里出现 1 (a×1/1×a/a÷1/a÷a)。
# 平凡题让模型靠回声/模式匹配蒙答案, 学不到真算术 (dev-notes/65 实测 mul 60% 平凡)。
exclude_trivial = true

# -----------------------------------------------------------------------------
# 运算定义。
#   name    : 内部名 (用于日志/去重)
#   fn      : 求值函数名 add/sub/mul/div (div 要求整除且除数非零)
#   symbols : ASCII/全角符号写法, 直接作为提示词里的运算符
#   words   : 中文/文字写法, 直接作为提示词里的运算符
# 提示词生成时从 symbols+words 里随机挑一种写法 (即"格式化噪音")。
# -----------------------------------------------------------------------------
[[op]]
name = "add"
fn = "add"
symbols = ["+", "＋"]
words = ["加", "加上", "加一加"]

[[op]]
name = "sub"
fn = "sub"
symbols = ["-", "－"]
words = ["减", "减去", "减掉"]

[[op]]
name = "mul"
fn = "mul"
symbols = ["*", "×", "x", "X", "＊"]
words = ["乘", "乘以", "乘上"]

[[op]]
name = "div"
fn = "div"
symbols = ["/", "÷"]
words = ["除以", "除"]

# -----------------------------------------------------------------------------
# 问句模板: {a} / {b} 是操作数, {op} 是上面挑好的运算符写法。
# 代码按顺序轮询/随机挑选, 生成完整提示词。
# -----------------------------------------------------------------------------
[[question]]
template = "{a}{op}{b}等于几？"

[[question]]
template = "{a}{op}{b}等于多少？"

[[question]]
template = "{a}{op}{b}？"

[[question]]
template = "算一下 {a}{op}{b} 等于几？"

[[question]]
template = "请问 {a}{op}{b} 是多少？"

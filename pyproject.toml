[project]
name = "nanoseek"
version = "0.1.0"
description = "nanoSeek clone for learning deep learning"
readme = "README.md"
authors = [
    { name = "vesita", email = "vesita164872@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1+rocm6.4",
    "pytorch-triton-rocm==3.5.1 ; sys_platform == 'linux'",
    "numpy",
    "tiktoken",
    "tqdm",
    "requests",
    "datasets>=5.0.1",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "tensorboard>=2.21.0",
    "matplotlib>=3.11.1",
    "tokenizers==0.23.1",
    "addict>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# 本项目是"应用"而不是"包"：所有脚本以扁平模块形式运行（from model import ...），
# 不需要构建安装 src 包。package=false 让 uv 跳过构建步骤。
[tool.uv]
package = false

# AMD ROCm 源（备用）：torch 官方 ROCm wheel 源。本机网络下载大文件不稳定，
# 所以 torch/pytorch-triton-rocm 在本机通过 gitignore 的 uv.toml（find-links）指向
# 本地 wheel 目录；换机器时删掉 uv.toml，把 dependencies 的版本改回无 +rocm6.4 后缀，
# 或用下方 index 从官方源安装。
# RX 6600 / gfx1032 需配合 HSA_OVERRIDE_GFX_VERSION=10.3.0 使用；
# ROCm 7.x 已移除 RDNA2，勿升级到 rocm7。
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

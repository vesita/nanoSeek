[project]
name = "nanoseek"
version = "0.1.0"
description = "nanoSeek clone for learning deep learning"
readme = "README.md"
authors = [
    { name = "vesita", email = "vesita164872@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1+rocm6.4",
    "pytorch-triton-rocm==3.5.1 ; sys_platform == 'linux'",
    "numpy",
    "tiktoken",
    "tqdm",
    "requests",
    "datasets>=5.0.1",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "tensorboard>=2.21.0",
    "matplotlib>=3.11.1",
    "tokenizers==0.23.1",
    "addict>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# 本项目是"应用"而不是"包"：所有脚本以扁平模块形式运行（from model import ...），
# 不需要构建安装 src 包。package=false 让 uv 跳过构建步骤。
[tool.uv]
package = false

# AMD ROCm 源（备用）：torch 官方 ROCm wheel 源。本机网络下载大文件不稳定，
# 所以 torch/pytorch-triton-rocm 在本机通过 gitignore 的 uv.toml（find-links）指向
# 本地 wheel 目录；换机器时删掉 uv.toml，把 dependencies 的版本改回无 +rocm6.4 后缀，
# 或用下方 index 从官方源安装。
# RX 6600 / gfx1032 需配合 HSA_OVERRIDE_GFX_VERSION=10.3.0 使用；
# ROCm 7.x 已移除 RDNA2，勿升级到 rocm7。
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

# 开发依赖：跑测试 / lint 用（uv sync --group dev）
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# -----------------------------------------------------------------------------
# 单元测试配置。设计约束（详见 tests/README.md）：
#   - 全部测试必须能在**纯 CPU** 上跑通；需要显卡的用例打 `@pytest.mark.gpu`，
#     无卡机器自动 skip，不会误报失败。
#   - `testpaths=tests` → 直接 `pytest` 即可，不会误扫 data/external 下几万个第三方文件。
#   - `pythonpath=.` → 让 `from model import ...` 在 tests/ 子目录里也能用。
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: 单条要跑十几秒以上（`pytest -m 'not slow'` 可跳过）",
    "gpu: 需要 GPU/ROCm（无卡机器自动 skip）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# -----------------------------------------------------------------------------
# lint：只开「一定是 bug」的规则，杜绝风格噪声把门禁变成摆设。
#
# 选这四条的依据（2026-09-10 全项目实测）：
#   F821 未定义名 → 1 处；F811 重复定义 → 1 处；F823 局部变量未绑定 → 0 处
# 合计只有 1 处真实违规，所以可以设**零容忍**。正确性由 tests/test_lint.py 守住。
#
# 故意**不**开：
#   E501 行宽、I 导入排序等纯风格规则 —— 这个仓库大量长行是有意为之；
#   F401 未使用导入（88 处）、F841 未使用变量（29 处）—— 遗留噪声太大，
#   开成硬门禁会逼人加 noqa，反而让门禁失去意义。想清理时单独跑：
#       ruff check --select F401 --fix
#
# 本次运行已按 F821/F811 修掉：
#   local/eval_mem_dialogue.py  TOP_K 被 import 后又被覆盖（前者失效）
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "data/external",       # 第三方语料仓库（几万个文件，不属于本项目）
    "data/openwebtext",
    "out",                 # 训练产物
    ".venv",
]

[tool.ruff.lint]
select = ["E9", "F821", "F811", "F823"]

